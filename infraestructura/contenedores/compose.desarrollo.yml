name: reddiff-desarrollo

services:
  base-datos:
    image: postgres:18.6-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: "${REDDIFF_BD_NOMBRE:-reddiff}"
      POSTGRES_USER: "${REDDIFF_BD_USUARIO_ADMIN:-reddiff_admin}"
      REDDIFF_BD_USUARIO_APLICACION: "${REDDIFF_BD_USUARIO_APLICACION:-reddiff_app}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresql_contrasena
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: "${REDDIFF_ZONA_HORARIA:-America/Guatemala}"
      PGTZ: "${REDDIFF_ZONA_HORARIA:-America/Guatemala}"
    ports:
      - "127.0.0.1:${REDDIFF_BD_PUERTO:-5432}:5432"
    volumes:
      - datos-postgresql:/var/lib/postgresql
      - ../base-datos/inicializacion:/docker-entrypoint-initdb.d:ro
      - ../base-datos/herramientas:/opt/reddiff/herramientas:ro
    secrets:
      - postgresql_contrasena
      - postgresql_aplicacion_contrasena
    networks:
      - red-interna
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready --host=127.0.0.1 --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    shm_size: 128mb
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      com.reddiff.componente: base-datos
      com.reddiff.entorno: desarrollo

networks:
  red-interna:
    driver: bridge

volumes:
  datos-postgresql:

secrets:
  postgresql_contrasena:
    file: ../../configuracion/secretos/postgresql_contrasena.txt
  postgresql_aplicacion_contrasena:
    file: ../../configuracion/secretos/postgresql_aplicacion_contrasena.txt
