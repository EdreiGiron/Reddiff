name: Validación continua

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servidor:
    name: Servidor .NET
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar .NET desde global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restaurar dependencias
        run: dotnet restore ./RedDiff.slnx

      - name: Compilar servidor
        run: dotnet build ./RedDiff.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas del servidor
        run: dotnet test ./RedDiff.slnx --configuration Release --no-build --logger "console;verbosity=minimal"

  cliente:
    name: Cliente Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cliente
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: cliente/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Comprobar formato
        run: npx prettier --check src

      - name: Ejecutar pruebas del cliente
        run: npm test -- --watch=false

      - name: Compilar cliente
        run: npm run build
