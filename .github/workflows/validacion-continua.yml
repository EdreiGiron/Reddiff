name: Validación continua

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servidor:
    name: Servidor .NET
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar .NET desde global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restaurar dependencias
        run: dotnet restore ./RedDiff.slnx

      - name: Compilar servidor
        run: dotnet build ./RedDiff.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas del servidor
        run: dotnet test ./RedDiff.slnx --configuration Release --no-build --logger "console;verbosity=minimal"

  cliente:
    name: Cliente Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cliente
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: cliente/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Comprobar formato
        run: npx prettier --check src

      - name: Ejecutar pruebas del cliente
        run: npm test -- --watch=false

      - name: Compilar cliente
        run: npm run build

  contenedores:
    name: Imágenes Docker
    needs:
      - servidor
      - cliente
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir imagen de PostgreSQL
        run: >-
          docker build
          --file infraestructura/contenedores/produccion/base-datos/Dockerfile
          --tag reddiff-base-datos:validacion
          .

      - name: Construir imagen de la API
        run: >-
          docker build
          --file infraestructura/contenedores/produccion/api/Dockerfile
          --tag reddiff-api:validacion
          .

      - name: Construir imagen del cliente
        run: >-
          docker build
          --file infraestructura/contenedores/produccion/web/Dockerfile
          --tag reddiff-web:validacion
          .

  paquete-windows:
    name: Paquete Windows
    needs:
      - servidor
      - cliente
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar .NET desde global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: cliente/package-lock.json

      - name: Generar paquete instalable
        shell: pwsh
        run: >-
          ./automatizacion/powershell/produccion-windows/Crear-Paquete-Produccion-Windows.ps1
          -OmitirPruebas

      - name: Conservar paquete Windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RedDiff-Windows-x64
          path: artifacts/windows/RedDiff-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
